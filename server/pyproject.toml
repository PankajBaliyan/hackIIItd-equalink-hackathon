[project]
name = "equalink-server"
version = "0.1.0"
description = "EquaLink backend: GitHub integration (more pipeline stages to come)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "anthropic>=1.0",
  "pyjwt[crypto]>=2.9",
  "playwright>=1.48",
  "axe-playwright-python>=0.1.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
